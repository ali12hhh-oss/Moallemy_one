name: Build
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
env:
  FLUTTER_VERSION: "3.44.7"
jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Auto-format code
        run: dart format .
      - name: Commit formatted code (if changed)
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code via CI"
          file_pattern: "*.dart"
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test
  build_android:
    name: Build Android (APK & AAB)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Show available resources
        run: |
          echo "== Memory =="
          free -h
          echo "== Disk =="
          df -h
      - name: Build release APK (unsigned)
        run: flutter build apk --release --split-per-abi --verbose
      - name: Show resources after build
        if: always()
        run: |
          echo "== Memory =="
          free -h
          echo "== Disk =="
          df -h
      - name: Build release AAB (unsigned)
        run: flutter build appbundle --release
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
