name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android (APK & AAB)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APKs
        run: |
          set +e
          flutter build apk --release --split-per-abi
          build_status=$?
          set -e

          # Flutter 3.44.7 may successfully produce APKs under
          # build/app/outputs/apk/release while returning an error because
          # it does not find them in its expected flutter-apk directory.
          apk_source="build/app/outputs/apk/release"
          apk_target="build/app/outputs/flutter-apk"
          mkdir -p "$apk_target"
          find "$apk_source" -maxdepth 1 -type f -name '*.apk' -exec cp -f {} "$apk_target/" \; 2>/dev/null || true

          apk_count=$(find "$apk_target" -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "No release APK was produced. Flutter build exit code: $build_status"
            exit "$build_status"
          fi
          echo "Found $apk_count release APK(s)."
      - name: Build release AAB
        run: |
          set +e
          flutter build appbundle --release
          build_status=$?
          set -e

          aab_source="build/app/outputs/bundle/release"
          aab_count=$(find "$aab_source" -maxdepth 1 -type f -name '*.aab' 2>/dev/null | wc -l)
          if [ "$aab_count" -eq 0 ]; then
            echo "No release AAB was produced. Flutter build exit code: $build_status"
            exit "$build_status"
          fi
          echo "Found $aab_count release AAB(s)."
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
