name: بناء التطبيق
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"
  GRADLE_VERSION: "8.14"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install dependencies
        run: flutter pub get

      # The repository's custom android/gradlew is missing the Gradle wrapper
      # JAR and attempts to download it from a URL that returns 404. Use the
      # verified Gradle distribution installed by setup-gradle instead.
      - name: Verify Gradle installation
        run: gradle --version

      - name: Build release APK with Gradle
        working-directory: android
        run: gradle app:assembleRelease --stacktrace --no-daemon

      - name: Locate and stage release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Android Gradle outputs..."
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK was not found at: $APK_PATH"
            echo "All APK files under android/app/build:"
            find android/app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk
          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk

          echo "Release APK staged successfully:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
