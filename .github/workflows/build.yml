name: بناء التطبيق
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"
  GRADLE_VERSION: "8.14"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install dependencies
        run: flutter pub get

      - name: Verify Gradle installation
        run: gradle --version

      - name: Repair Android CMake 3.22.1 installation
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          CMAKE_DIR="${ANDROID_SDK_ROOT}/cmake/3.22.1"

          echo "Removing any incomplete/corrupted CMake 3.22.1 installation..."
          "$SDKMANAGER" --uninstall "cmake;3.22.1" || true
          rm -rf "$CMAKE_DIR"

          echo "Installing a clean CMake 3.22.1 package..."
          "$SDKMANAGER" --install "cmake;3.22.1"

          if [ ! -x "$CMAKE_DIR/bin/cmake" ]; then
            echo "CMake 3.22.1 installation is incomplete."
            exit 1
          fi

          "$CMAKE_DIR/bin/cmake" --version

      - name: Build release APK with Gradle
        working-directory: android
        run: gradle app:assembleRelease --stacktrace --no-daemon --warning-mode all

      - name: Locate and stage release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Android Gradle outputs..."
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK was not found at: $APK_PATH"
            echo "All APK files under android/app/build:"
            find android/app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk
          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk

          echo "Release APK staged successfully:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v6
        with:
          name: daleel-child-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build_google_play_aab:
    name: Build Google Play AAB (validation)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install dependencies
        run: flutter pub get

      - name: Verify Gradle installation
        run: gradle --version

      - name: Repair Android CMake 3.22.1 installation
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          CMAKE_DIR="${ANDROID_SDK_ROOT}/cmake/3.22.1"

          echo "Removing any incomplete/corrupted CMake 3.22.1 installation..."
          "$SDKMANAGER" --uninstall "cmake;3.22.1" || true
          rm -rf "$CMAKE_DIR"

          echo "Installing a clean CMake 3.22.1 package..."
          "$SDKMANAGER" --install "cmake;3.22.1"

          if [ ! -x "$CMAKE_DIR/bin/cmake" ]; then
            echo "CMake 3.22.1 installation is incomplete."
            exit 1
          fi

          "$CMAKE_DIR/bin/cmake" --version

      - name: Build release App Bundle
        working-directory: android
        run: gradle app:bundleRelease --stacktrace --no-daemon --warning-mode all

      - name: Locate and stage release AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "Expected AAB was not found at: $AAB_PATH"
            echo "All AAB files under android/app/build:"
            find android/app/build -type f -name "*.aab" -print || true
            exit 1
          fi

          mkdir -p build/app/outputs/bundle/release
          cp "$AAB_PATH" build/app/outputs/bundle/release/app-release.aab

          echo "Release AAB staged successfully:"
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload Google Play AAB validation artifact
        uses: actions/upload-artifact@v6
        with:
          name: daleel-child-google-play-aab-validation
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
