name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build one universal release APK
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons
      - name: Collect and verify universal APK
        run: |
          set -e
          apk_source="build/app/outputs/flutter-apk/app-release.apk"
          apk_dir="build/app/outputs/flutter-apk"
          apk_target="$apk_dir/daleel-child-universal-release.apk"

          test -f "$apk_source"
          cp -f "$apk_source" "$apk_target"

          echo "Universal release APK:"
          ls -lh "$apk_target"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$apk_target"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-universal-apk
          path: build/app/outputs/flutter-apk/daleel-child-universal-release.apk
          if-no-files-found: error
