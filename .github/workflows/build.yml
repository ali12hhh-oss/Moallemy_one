name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build universal release APK
        run: |
          set +e
          flutter build apk --release
          build_status=$?
          set -e

          apk_target="build/app/outputs/flutter-apk"
          mkdir -p "$apk_target"

          # Flutter 3.44.7 may place the generated APK in the Gradle output
          # directory even when its artifact-discovery step reports an error.
          find build/app/outputs/apk -type f -name '*.apk' -exec cp -f {} "$apk_target/daleel-child-release.apk" \; 2>/dev/null || true

          if [ ! -f "$apk_target/daleel-child-release.apk" ]; then
            echo "No release APK was produced. Flutter build exit code: $build_status"
            exit "$build_status"
          fi

          echo "Universal signed release APK created:"
          ls -lh "$apk_target/daleel-child-release.apk"
      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/daleel-child-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-apk
          path: build/app/outputs/flutter-apk/daleel-child-release.apk
          if-no-files-found: error
