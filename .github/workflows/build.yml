name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project source
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK with Flutter
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Locate, Verify and Copy APK
        run: |
          set -e
          echo "Searching for any generated release APK..."
          find build -name "*.apk"
          
          # إنشاء المجلد المستهدف لضمان وجوده
          mkdir -p build/app/outputs/flutter-apk/
          
          # البحث الفعلي عن ملف الـ APK في مسارات الإخراج المحتملة ونسخه للمسار القياسي
          APK_PATH=$(find build -type f -name "app-release.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            # محاولة بحث عامة لو كان المسار مختلفاً
            APK_PATH=$(find build -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk
            echo "Successfully copied to target path."
          else
            echo "Error: No APK file generated by Gradle."
            exit 1
          fi
          
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
