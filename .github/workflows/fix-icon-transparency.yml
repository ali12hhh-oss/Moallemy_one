name: Fix icon corner transparency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Remove only corner-connected white pixels
        run: python tooling/remove_icon_corner_white.py

      - name: Commit repaired icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res/mipmap-*/ic_launcher.png
          if git diff --cached --quiet; then
            echo 'No icon changes required.'
          else
            git commit -m 'Fix white corners in app icons'
            git push
          fi
