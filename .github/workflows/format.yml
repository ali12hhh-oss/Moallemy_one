name: Format Check

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ "main" ]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .
